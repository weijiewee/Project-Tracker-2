<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Portfolio Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
<div class="max-w-7xl mx-auto p-6">
<h1 class="text-4xl font-bold mb-6">Project Portfolio Tracker</h1>
<div class="grid grid-cols-1 md:grid-cols-6 gap-4 mb-6">
<div class="bg-white p-4 rounded shadow"><div>Total Projects</div><div id="totalProjects">0</div></div>
<div class="bg-blue-100 p-4 rounded shadow"><div>In Progress</div><div id="inProgress">0</div></div>
<div class="bg-green-100 p-4 rounded shadow"><div>Completed</div><div id="completed">0</div></div>
<div class="bg-red-100 p-4 rounded shadow"><div>At Risk</div><div id="atRisk">0</div></div>
<div class="bg-gray-100 p-4 rounded shadow"><div>Not Started</div><div id="notStarted">0</div></div>
<div class="bg-emerald-100 p-4 rounded shadow"><div>Completion %</div><div id="completionRate">0%</div></div>
</div>
<div class="bg-white p-6 rounded shadow mb-6">
<div class="grid md:grid-cols-5 gap-3">
<input id="projectName" class="border p-2" placeholder="Project Name">
<input id="owner" class="border p-2" placeholder="Owner">
<input id="startDate" type="date" class="border p-2">
<select id="status" class="border p-2"><option>Not Started</option><option>In Progress</option><option>Completed</option><option>At Risk</option></select>
<input id="remarks" class="border p-2" placeholder="Remarks">
</div>
<button onclick="addProject()" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded">Add Project</button>
</div>
<div class="bg-white rounded shadow overflow-auto">
<table class="w-full">
<thead><tr><th>Project Name</th><th>Owner</th><th>Start Date</th><th>Status</th><th>Remarks</th><th>Age (Days)</th></tr></thead>
<tbody id="projectTable"></tbody>
</table>
</div>
</div>
<script>
let projects=[];
function getAge(d){if(!d) return '-'; return Math.floor((new Date()-new Date(d))/86400000);} 
function addProject(){const p={id:Date.now(),projectName:projectName.value,owner:owner.value,startDate:startDate.value,status:status.value,remarks:remarks.value}; if(!p.projectName||!p.owner){alert('Project Name and Owner are required');return;} projects.push(p); render();}
function updateStatus(id,v){projects=projects.map(p=>p.id===id?{...p,status:v}:p); updateDashboard();}
function updateRemarks(id,v){projects=projects.map(p=>p.id===id?{...p,remarks:v}:p);}
function updateDashboard(){let t=projects.length,c=projects.filter(x=>x.status==='Completed').length,ip=projects.filter(x=>x.status==='In Progress').length,ar=projects.filter(x=>x.status==='At Risk').length,ns=projects.filter(x=>x.status==='Not Started').length; totalProjects.innerText=t;completed.innerText=c;inProgress.innerText=ip;atRisk.innerText=ar;notStarted.innerText=ns;completionRate.innerText=t?Math.round(c*100/t)+'%':'0%';}
function render(){projectTable.innerHTML='';projects.forEach(project=>{projectTable.innerHTML+=`<tr><td>${project.projectName}</td><td>${project.owner}</td><td>${project.startDate}</td><td><select onchange="updateStatus(${project.id},this.value)"><option ${project.status==='Not Started'?'selected':''}>Not Started</option><option ${project.status==='In Progress'?'selected':''}>In Progress</option><option ${project.status==='Completed'?'selected':''}>Completed</option><option ${project.status==='At Risk'?'selected':''}>At Risk</option></select></td><td><input value="${project.remarks}" onchange="updateRemarks(${project.id},this.value)"></td><td>${getAge(project.startDate)}</td></tr>`;}); updateDashboard();}
render();
</script>
</body>
</html>
